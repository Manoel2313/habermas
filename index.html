<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Half-Life Index — Capítulo 1: Chegada</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: monospace; }
  canvas { display: block; }
  #hint { position: fixed; bottom: 12px; width: 100%; text-align: center;
          color: #556; font-size: 13px; pointer-events: none; user-select: none; }
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
             background: rgba(0,0,0,0.85); color: #cfc; font-size: 18px; text-align: center;
             cursor: pointer; user-select: none; }
</style>
</head>
<body>
<div id="overlay">Clique para entrar no elevador</div>
<div id="hint">WASD / setas para andar • Mouse para olhar</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { Engine } from './common/engine.js';
import { Chapter1 } from './chapter1/level.js';

const overlay = document.getElementById('overlay');
overlay.addEventListener('click', () => {
  overlay.style.display = 'none';
  Engine.init(document.getElementById('app') || document.body);
  Engine.loadLevel(Chapter1);
  Engine.start();
});
</script>
</body>
</html>
